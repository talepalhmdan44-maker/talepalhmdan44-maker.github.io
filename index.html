<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="SmartPick helps you discover useful technology, home essentials and smart everyday products.">
<title>SmartPick | Smart Choices for Everyday Life</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
font-family:Arial,Helvetica,sans-serif;
background:#f5f7fb;
color:#172033;
line-height:1.6
}
header{
background:#101828;
color:white;
padding:22px 5%;
}
.header-inner{
max-width:1200px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
gap:15px
}
.logo{font-size:27px;font-weight:bold;color:#61dafb}
nav a{
color:white;
text-decoration:none;
margin:0 10px;
font-size:14px
}
nav a:hover{color:#61dafb}
.hero{
padding:75px 20px;
text-align:center;
background:linear-gradient(135deg,#14213d,#2563eb);
color:white
}
.hero h1{font-size:42px;margin-bottom:15px}
.hero p{max-width:700px;margin:0 auto 25px;color:#e0eaff}
.button{
display:inline-block;
background:#61dafb;
color:#101828;
padding:12px 22px;
border-radius:8px;
text-decoration:none;
font-weight:bold
}
.container{
max-width:1200px;
margin:auto;
padding:40px 20px
}
.section-title{
text-align:center;
margin-bottom:30px;
font-size:30px
}
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px
}
.card{
background:white;
border-radius:14px;
padding:25px;
box-shadow:0 4px 15px rgba(0,0,0,.06);
transition:.2s
}
.card:hover{transform:translateY(-4px)}
.card h3{margin-bottom:10px;color:#1d4ed8}
.card p{color:#596579;margin-bottom:15px}
.card a{
display:inline-block;
background:#14213d;
color:white;
padding:10px 16px;
border-radius:7px;
text-decoration:none
}
.disclosure{
background:#e8f3ff;
border:1px solid #c5e0ff;
border-radius:10px;
padding:18px;
margin-bottom:30px;
font-size:14px
}
.info-section{
background:white;
padding:30px;
border-radius:12px;
margin-bottom:25px
}
.info-section h2{margin-bottom:15px;color:#1d4ed8}
.info-section p{margin-bottom:12px}
footer{
background:#101828;
color:white;
padding:35px 20px;
text-align:center
}
footer a{color:#61dafb;text-decoration:none;margin:0 8px}
footer p{margin:10px 0}
@media(max-width:600px){
.hero h1{font-size:30px}
.header-inner{justify-content:center}
nav{text-align:center}
nav a{display:inline-block;margin:5px}
}
</style>
</head>

<body>

<header>
<div class="header-inner">
<div class="logo">SmartPick</div>
<nav>
<a href="#home">Home</a>
<a href="#products">Products</a
